<hr>

<h2>Apply for Personal Loan</h2>

<form>
  <label>
    Full Name:
    <input type="text" name="fullName" />
  </label>
  <br><br>

  <label>
    Loan Amount:
    <input type="number" name="loanAmount" />
  </label>
  <br><br>

  <label>
    Tenure (years):
    <select name="tenure">
      <option>1</option>
      <option>3</option>
      <option>5</option>
    </select>
  </label>
  <br><br>

  <button type="submit">Apply Now</button>
</form>
